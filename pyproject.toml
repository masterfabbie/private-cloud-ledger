[project]
name = "proud-ledger"
version = "2.2.0"
description = "Proud Ledger - private cloud ledger: self-hosted finance tracker with bank CSV import"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "authlib>=1.8",
    "httpx2>=2.13",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
